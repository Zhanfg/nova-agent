name: Nova Signed Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-release:
    name: 构建签名 Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置 JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic

      - name: 配置 Android SDK 工具
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: 安装 Android SDK 37
        run: sdkmanager --channel=3 "platforms;android-37.0"

      - name: 还原 Nova 发布证书
        env:
          NOVA_RELEASE_KEYSTORE_BASE64: ${{ secrets.NOVA_RELEASE_KEYSTORE_BASE64 }}
          NOVA_RELEASE_STORE_PASSWORD: ${{ secrets.NOVA_RELEASE_STORE_PASSWORD }}
          NOVA_RELEASE_KEY_ALIAS: ${{ secrets.NOVA_RELEASE_KEY_ALIAS }}
          NOVA_RELEASE_KEY_PASSWORD: ${{ secrets.NOVA_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$NOVA_RELEASE_KEYSTORE_BASE64" ||
                -z "$NOVA_RELEASE_STORE_PASSWORD" ||
                -z "$NOVA_RELEASE_KEY_ALIAS" ||
                -z "$NOVA_RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::缺少 Nova Release 签名 Secrets。"
            exit 1
          fi
          printf '%s' "$NOVA_RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/nova-release.jks"
          test -s "$RUNNER_TEMP/nova-release.jks"

      - name: 构建签名 Release APK
        env:
          NOVA_RELEASE_STORE_FILE: ${{ runner.temp }}/nova-release.jks
          NOVA_RELEASE_STORE_PASSWORD: ${{ secrets.NOVA_RELEASE_STORE_PASSWORD }}
          NOVA_RELEASE_KEY_ALIAS: ${{ secrets.NOVA_RELEASE_KEY_ALIAS }}
          NOVA_RELEASE_KEY_PASSWORD: ${{ secrets.NOVA_RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon --stacktrace --no-configuration-cache
          :app:testReleaseUnitTest :app:assembleRelease

      - name: 验证并整理 Release APK
        id: apk
        run: |
          release_apk="app/build/outputs/apk/release/app-release.apk"
          output_dir="$RUNNER_TEMP/apks"
          output_apk="$output_dir/Nova-${GITHUB_REF_NAME}.apk"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          if [[ ! -s "$release_apk" ]]; then
            echo "::error::未生成有效的 Release APK。"
            exit 1
          fi
          if [[ -z "$apksigner_path" ]]; then
            echo "::error::未找到 apksigner。"
            exit 1
          fi

          "$apksigner_path" verify --verbose --print-certs "$release_apk"
          mkdir -p "$output_dir"
          cp "$release_apk" "$output_apk"
          sha256sum "$output_apk" > "$output_apk.sha256"
          echo "apk=$output_apk" >> "$GITHUB_OUTPUT"
          echo "checksum=$output_apk.sha256" >> "$GITHUB_OUTPUT"

      - name: 上传 Release APK 与校验文件
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nova-release-${{ github.ref_name }}
          path: |
            ${{ steps.apk.outputs.apk }}
            ${{ steps.apk.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30
