name: One-shot model test diagnostic

on:
  push:
    branches:
      - feat/mobile-codex-workspaces
    paths:
      - .github/workflows/one-shot-model-test-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Phase 2 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/mobile-codex-workspaces
          fetch-depth: 0

      - name: Configure JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "25"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-provider: basic

      - name: Configure Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install Android SDK 37
        run: sdkmanager --channel=3 "platforms;android-37.0"

      - name: Run model tests without aborting diagnostics
        id: model_tests
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace --no-configuration-cache \
            :app:testDebugUnitTest \
            --tests 'fuck.andes.agent.model.*'
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Extract failing JUnit cases
        shell: bash
        env:
          MODEL_TEST_EXIT: ${{ steps.model_tests.outputs.exit_code }}
        run: |
          mkdir -p docs/diagnostics
          python3 - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET

          root = Path('app/build/test-results/testDebugUnitTest')
          out = Path('docs/diagnostics/model-test-failure.txt')
          exit_code = os.environ.get('MODEL_TEST_EXIT', '?')
          lines = [f'model shard gradle exit: {exit_code}', '']
          failures = []

          for xml in sorted(root.glob('TEST-*.xml')):
              try:
                  suite = ET.parse(xml).getroot()
              except Exception as exc:
                  failures.append((xml.name, '<xml-parse>', f'{type(exc).__name__}: {exc}'))
                  continue
              for case in suite.findall('testcase'):
                  problem = case.find('failure') or case.find('error')
                  if problem is None:
                      continue
                  name = case.attrib.get('name', '<unnamed>')
                  cls = case.attrib.get('classname', suite.attrib.get('name', '<unknown>'))
                  msg = problem.attrib.get('message', '')
                  body = problem.text or ''
                  text = (msg + '\n' + body).strip()
                  failures.append((cls, name, text))

          if not failures:
              if exit_code == '0':
                  lines.append('No failing JUnit test cases; isolated model shard passed.')
              else:
                  lines.append('Gradle failed but no JUnit failure element was produced.')
                  lines.append('Available result files:')
                  for p in sorted(root.glob('*')):
                      lines.append(f'- {p.name}')
          else:
              lines.append(f'failing cases: {len(failures)}')
              for index, (cls, name, text) in enumerate(failures, 1):
                  lines.extend(['', f'=== FAILURE {index} ===', f'class: {cls}', f'test: {name}'])
                  if text:
                      bounded = text[:12000]
                      lines.append(bounded)
                      if len(text) > len(bounded):
                          lines.append('... stack trace truncated ...')

          payload = '\n'.join(lines)
          out.write_text(payload[:24000] + ('\n... diagnostic truncated ...\n' if len(payload) > 24000 else ''))
          PY

      - name: Commit diagnostic and remove helper workflow
        shell: bash
        run: |
          git config user.name 'Axymorrsen'
          git config user.email 'Axymosen@outlook.com'
          git rm .github/workflows/one-shot-model-test-diagnostic.yml
          git add docs/diagnostics/model-test-failure.txt
          git commit -m 'ci: capture isolated model test diagnostic'
          git push origin HEAD:feat/mobile-codex-workspaces
