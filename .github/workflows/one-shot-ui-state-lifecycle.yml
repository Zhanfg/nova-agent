name: One-shot UI state lifecycle fix

on:
  push:
    branches:
      - fix/ci-baseline-and-nova-branding
    paths:
      - .github/workflows/one-shot-ui-state-lifecycle.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/ci-baseline-and-nova-branding
          fetch-depth: 0

      - name: Patch AgentAppState lifecycle and test
        shell: bash
        run: |
          echo '' | base64 -d >/tmp/ui_state_lifecycle.py
          python3 /tmp/ui_state_lifecycle.py
          git diff --check
          git diff -- app/src/main/kotlin/fuck/andes/ui/app/AgentAppState.kt app/src/test/java/fuck/andes/ui/app/AgentConversationStoreTest.kt

      - name: Commit lifecycle fix and remove helper workflow
        shell: bash
        run: |
          git config user.name 'Axymorrsen'
          git config user.email 'Axymosen@outlook.com'
          git rm .github/workflows/one-shot-ui-state-lifecycle.yml
          git add app/src/main/kotlin/fuck/andes/ui/app/AgentAppState.kt app/src/test/java/fuck/andes/ui/app/AgentConversationStoreTest.kt
          git commit -m 'test: isolate AgentAppState background lifecycle'
          git push origin HEAD:fix/ci-baseline-and-nova-branding
