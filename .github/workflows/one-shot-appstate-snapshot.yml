name: One-shot AgentAppState snapshot injection

on:
  push:
    branches:
      - fix/ci-baseline-and-nova-branding
    paths:
      - .github/workflows/one-shot-appstate-snapshot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/ci-baseline-and-nova-branding
          fetch-depth: 0
      - name: Patch snapshot injection
        shell: bash
        run: |
          echo '' | base64 -d >/tmp/appstate_snapshot.py
          python3 /tmp/appstate_snapshot.py
          git diff --check
      - name: Commit and remove helper
        shell: bash
        run: |
          git config user.name 'Axymorrsen'
          git config user.email 'Axymosen@outlook.com'
          git rm .github/workflows/one-shot-appstate-snapshot.yml
          git add app/src/main/kotlin/fuck/andes/ui/app/AgentAppState.kt app/src/test/java/fuck/andes/ui/app/AgentConversationStoreTest.kt
          git commit -m 'test: inject AgentAppState snapshot for state-only coverage'
          git push origin HEAD:fix/ci-baseline-and-nova-branding
