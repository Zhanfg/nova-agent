name: One-shot wire workspace tools

on:
  push:
    branches:
      - feat/mobile-codex-workspaces
    paths:
      - .github/workflows/one-shot-wire-workspace-tools.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/mobile-codex-workspaces
          fetch-depth: 0

      - name: Patch AgentLocalTools
        shell: bash
        run: |
          echo '' | base64 -d >/tmp/wire_workspace.py
          python3 /tmp/wire_workspace.py
          git diff --check

      - name: Commit wiring and remove helper workflow
        shell: bash
        run: |
          git config user.name 'Axymorrsen'
          git config user.email 'Axymosen@outlook.com'
          git rm .github/workflows/one-shot-wire-workspace-tools.yml
          git add app/src/main/kotlin/fuck/andes/agent/tool/AgentLocalTools.kt
          git commit -m 'feat: wire workspace tools into AgentLocalTools'
          git push origin HEAD:feat/mobile-codex-workspaces
