name: One-shot Goal mode runtime

on:
  push:
    branches:
      - feat/mobile-codex-workspaces
    paths:
      - .github/workflows/one-shot-goal-runtime.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/mobile-codex-workspaces
          fetch-depth: 0
      - name: Apply Goal runtime patch
        run: python3 .github/patches/goal_mode_runtime.py
      - name: Validate patch
        run: git diff --check
      - name: Commit and remove helpers
        run: |
          git config user.name 'Axymorrsen'
          git config user.email 'Axymosen@outlook.com'
          git rm .github/workflows/one-shot-goal-runtime.yml .github/patches/goal_mode_runtime.py
          git add app/src/main/kotlin/fuck/andes/agent/goal/AgentGoalSession.kt app/src/main/kotlin/fuck/andes/agent/model/AgentModelClient.kt app/src/main/kotlin/fuck/andes/agent/model/AgentLoop.kt
          git commit -m 'feat: enforce Goal mode completion evidence in AgentLoop'
          git push origin HEAD:feat/mobile-codex-workspaces
