name: One-shot runtime duplicate runId rejection

on:
  push:
    branches:
      - fix/ci-baseline-and-nova-branding
    paths:
      - .github/workflows/one-shot-runtime-duplicate-run-id.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/ci-baseline-and-nova-branding
          fetch-depth: 0
      - name: Apply duplicate runId patch
        run: python3 .github/patches/runtime_duplicate_run_id.py
      - name: Validate patch
        run: git diff --check
      - name: Commit and remove helpers
        run: |
          git config user.name 'Axymorrsen'
          git config user.email 'Axymosen@outlook.com'
          git rm .github/workflows/one-shot-runtime-duplicate-run-id.yml .github/patches/runtime_duplicate_run_id.py
          git add app/src/main/kotlin/fuck/andes/agent/runtime/AgentRuntimeService.kt
          git commit -m 'fix: reject duplicate in-flight Runtime runIds'
          git push origin HEAD:fix/ci-baseline-and-nova-branding
