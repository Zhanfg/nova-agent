name: One-shot wire queue policy

on:
  push:
    branches:
      - fix/ci-baseline-and-nova-branding
    paths:
      - .github/workflows/one-shot-wire-queue-policy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/ci-baseline-and-nova-branding
          fetch-depth: 0

      - name: Wire queue policy
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/wire_queue_policy.py
          python3 /tmp/wire_queue_policy.py
          git diff --check
          git diff -- app/src/main/kotlin/fuck/andes/agent/runtime/AgentRuntimeService.kt

      - name: Commit runtime wiring and remove helper workflow
        shell: bash
        run: |
          git config user.name 'Axymorrsen'
          git config user.email 'Axymosen@outlook.com'
          git rm .github/workflows/one-shot-wire-queue-policy.yml
          git add app/src/main/kotlin/fuck/andes/agent/runtime/AgentRuntimeService.kt
          git commit -m 'refactor: wire tested queue policy into runtime'
          git push origin HEAD:fix/ci-baseline-and-nova-branding
