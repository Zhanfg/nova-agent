name: One-shot structured Git output

on:
  push:
    branches:
      - feat/mobile-codex-workspaces
    paths:
      - .github/workflows/one-shot-structured-git-output.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/mobile-codex-workspaces
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/patches/structured_git_output.py
      - name: Validate patch
        run: git diff --check
      - name: Commit patch and remove helpers
        run: |
          git config user.name 'Axymorrsen'
          git config user.email 'Axymosen@outlook.com'
          git rm .github/workflows/one-shot-structured-git-output.yml .github/patches/structured_git_output.py
          git add app/src/main/kotlin/fuck/andes/agent/terminal/RootShellTerminalController.kt app/src/main/kotlin/fuck/andes/agent/workspace/RootShellGitExecutor.kt
          git commit -m 'feat: add bounded structured output for Git review'
          git push origin HEAD:feat/mobile-codex-workspaces
